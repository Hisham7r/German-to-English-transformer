dataset:
  name: bentrevett/multi30k
  source_lang: de
  target_lang: en

tokenizer:
  vocab_size: 8000
  special_tokens:
    pad: "<pad>"
    sos: "<sos>"
    eos: "<eos>"
    unk: "<unk>"

model:
  d_model: 512
  max_len: 100
  dropout: 0.1
  num_heads: 8

