dataset:
  name: bentrevett/multi30k
  source_lang: de
  target_lang: en

tokenizer:
  vocab_size: 8000
  special_tokens:
    pad: "<pad>"
    sos: "<sos>"
    eos: "<eos>"
    unk: "<unk>"

model:
  d_model: 512
  max_len: 100
  dropout: 0.1
  num_heads: 8
  d_ff: 2048
  num_layers: 6

# Deliberately tiny model dims, used only by overfit_sanity_check.py.
# Local CPU dev machine has no GPU — the full-size model above is far too
# slow to overfit locally in a reasonable time. This exists purely to prove
# the architecture/training wiring is correct before the real run on Colab.
sanity_check:
  d_model: 128
  num_heads: 4
  d_ff: 256
  num_layers: 2

# Real training run (Colab). Values are provisional starting points, not tuned:
# warmup_steps is far below the paper's 4000 because the paper's value was
# chosen for WMT-scale data; with 29k pairs at batch 128 (~227 steps/epoch),
# 4000 steps would be ~18 epochs of pure warmup.
training:
  batch_size: 128
  num_epochs: 30
  warmup_steps: 1000
  label_smoothing: 0.1
  grad_clip_norm: 1.0
  adam_betas: [0.9, 0.98]
  adam_eps: 1.0e-9
  seed: 42

# `python src/train.py --smoke`: local CPU pipeline check only. Uses the small
# sanity_check model dims and a tiny data subset; not a real training run.
smoke_test:
  train_pairs: 256
  val_pairs: 64
  batch_size: 32
  num_epochs: 15
  warmup_steps: 100
